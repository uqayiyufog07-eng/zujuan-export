name = "zujuan-export"
pages_build_output_dir = "public"
compatibility_date = "2024-06-01"

# 试卷导出文件存储（Word / PDF）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "zujuan-exports"

# 导出记录索引
[[kv_namespaces]]
binding = "EXPORT_INDEX"
id = "67aaf54830b94701a9ea710de3351f78"
preview_id = "45ab7fd5be6843e3add668b18d8d76ae"

# 组卷网登录 Cookie（解决答案解析等需登录内容；不要在仓库里明文写）
# 本地配置：wrangler pages secret put ZUJUAN_COOKIE
# Dashboard：Pages → zujuan-export → Settings → Environment variables 添加 ZUJUAN_COOKIE
# 注意：Cookie 是运行时变量，不要放进 GitHub Secrets 让 Action 写入
