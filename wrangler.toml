name = "zujuan-export"
pages_build_output_dir = "public"
compatibility_date = "2024-06-01"

# 试卷导出文件存储（Word / PDF）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "zujuan-exports"

# 导出记录索引
[[kv_namespaces]]
binding = "EXPORT_INDEX"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

# 组卷网登录 Cookie（解决答案解析等需登录内容；不要在仓库里明文写）
# 本地/线上配置方式：
#   wrangler pages secret put ZUJUAN_COOKIE
# 或在 Cloudflare Dashboard → Pages → zujuan-export → Settings → Environment variables 中添加 ZUJUAN_COOKIE
