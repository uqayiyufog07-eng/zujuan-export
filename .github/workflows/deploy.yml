name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 手动部署原因（可留空）
        required: false

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  PROJECT_NAME: zujuan-export
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check (前端 + Functions)
        run: |
          node -e "
            const fs=require('fs');
            const html=fs.readFileSync('public/index.html','utf8');
            const m=html.match(/<script>([\s\S]*)<\/script>/);
            if(!m) throw new Error('内嵌 script 未找到');
            fs.writeFileSync('._check.js', m[1]);
          "
          node --check ._check.js && rm ._check.js
          for f in $(find functions -name '*.js'); do node --check "$f"; done
          echo "语法检查通过"

      - name: Ensure Pages project exists
        run: |
          npx --yes wrangler@3 pages project create "$PROJECT_NAME" \
            --production-branch=main || echo "项目已存在，继续部署"

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3"
          command: pages deploy public --project-name=${{ env.PROJECT_NAME }} --branch=main --commit-dirty=true

      - name: Summary
        run: |
          {
            echo "### 部署完成 ✅"
            echo ""
            echo "- 地址：${{ steps.deploy.outputs.deployment-url }}"
            echo "- 分支：${{ github.ref_name }} @ ${{ github.sha }}"
            echo ""
            echo "> 首次部署需要在 Cloudflare Pages 设置里确认 R2 / KV 绑定与 \`ZUJUAN_COOKIE\` 环境变量。"
          } >> "$GITHUB_STEP_SUMMARY"
