name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  PROJECT_NAME: zujuan-export
  WRANGLER_VERSION: "4.47.0"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check (前端 + Functions)
        run: |
          node -e "
            const fs=require('fs');
            const html=fs.readFileSync('public/index.html','utf8');
            const m=html.match(/<script>([\s\S]*)<\/script>/);
            if(!m) throw new Error('内嵌 script 未找到');
            fs.writeFileSync('._check.js', m[1]);
          "
          node --check ._check.js && rm ._check.js
          for f in $(find functions -name '*.js'); do node --check "$f"; done
          echo "语法检查通过"

      - name: Ensure Pages project exists
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" pages project create "$PROJECT_NAME" \
            --production-branch=main || echo "项目已存在，继续部署"

      - name: Deploy
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy public \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true

      - name: Summary
        run: |
          {
            echo "### 部署完成 ✅"
            echo ""
            echo "- 仓库：${{ github.repository }} @ ${{ github.sha }}"
            echo "- 线上地址：https://${PROJECT_NAME}.pages.dev/"
            echo ""
            echo "> 首次部署后请在 Cloudflare Pages → Settings 确认 R2 / KV 绑定与 \`ZUJUAN_COOKIE\` 环境变量。"
          } >> "$GITHUB_STEP_SUMMARY"
